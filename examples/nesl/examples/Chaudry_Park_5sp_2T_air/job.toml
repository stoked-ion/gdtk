# Comparison case taken from:
# Chaudhry, Boyd, and Candler (2020) "Vehicle-Scale Simulations of Hypersonic Flows using the MMT Chemical Kinetics Model"
# AIAA AVIATION 2020 FORUM, DOI: 10.2514/6.2020-3272

# Freestream.
T_INF = 270.0
P_INF = 287.0
U_INF = 5000.0
MASS_FRAC = {N2=0.767, O2=0.233}

# Geometry.
RADIUS = 0.1
DOMAIN = 0.008
AXISYMMETRIC = true   

# Models.
GAS_MODEL = "air-5sp.gas"
CHEM_MODEL = "air-5sp.chem"
EXCHANGE_MODEL = "air-5sp.kin"

# Grid.
CELLS = 300
CLUSTERING = 1.01 

# Wall.
T_WALL = 1000.0
VISCOSITY = true  
LEWIS_NUM = 1.0

# Time stepping.
T_END = {steady = 1e-1}
MAX_ITERS = 1.5e6
CFL_c = 0.1
CFL_d = 0.1
LTS = true

# Output.
SAVE = "chaudry.dat" 
PLOT = true
VERBOSE = true